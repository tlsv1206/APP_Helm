replicaCount: 2

image:
  repository: tiagovedana/hello-k8s
  tag: prod
  pullPolicy: IfNotPresent

app:
  name: hello-world-production
  port: 5000
  env: production

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  path: /
  pathType: Prefix
  host: hello-world.tvedana.com